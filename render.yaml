services:
  - type: web
    name: cargaexpress-simulator-a
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTO_SIMULATE
        value: "true"
      - key: SIM_RATE
        value: "0.5"
      - key: RECEIVER_RETENTION_DAYS
        value: "3"
